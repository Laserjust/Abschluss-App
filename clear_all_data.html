<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alle Daten löschen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f7;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #856404;
        }
        button {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #d70015;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Alle localStorage-Daten löschen</h1>
        
        <div class="warning">
            <strong>⚠️ Warnung:</strong> Diese Aktion löscht ALLE localStorage-Daten für diese Domain. 
            Dies umfasst alle Jahrgänge und alle gespeicherten Einstellungen.
        </div>
        
        <p>Klicken Sie auf "Alle Daten löschen", um das localStorage komplett zu leeren:</p>
        
        <button onclick="clearAllData()">Alle Daten löschen</button>
        
        <div id="result"></div>
    </div>

    <script>
        function clearAllData() {
            try {
                // Alle localStorage-Daten löschen
                localStorage.clear();
                
                document.getElementById('result').innerHTML = `
                    <div class="success">
                        <strong>✅ Erfolgreich!</strong><br>
                        Alle localStorage-Daten wurden gelöscht.<br>
                        <strong>Bitte laden Sie die Anwendung neu, um die Änderungen zu sehen.</strong>
                    </div>
                `;
                
                console.log('✅ Alle localStorage-Daten wurden gelöscht');
                
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 8px; color: #721c24;">
                        <strong>❌ Fehler:</strong> ${error.message}
                    </div>
                `;
                console.error('Fehler beim Löschen der Daten:', error);
            }
        }
    </script>
</body>
</html>
